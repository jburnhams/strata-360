name: Integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    env:
      STRATA_NO_RESOURCE_LIMITS: '1'          # the machine guards are for local machines; a CI runner is a VM of its own
      # CI VMs have no video hardware: use the software paths on every OS (the hardware paths are covered by tests/unit/test_hw.py)
      STRATA_HWACCEL: none
      STRATA_ENCODER: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          # Chocolatey's community feed is sometimes down (503) and choco then exits 0 without ffmpeg: try it three times, then fall back to the static GPL build on GitHub (it has libx265)
          $ok = $false
          for ($i = 0; $i -lt 3 -and -not $ok; $i++) {
            choco install ffmpeg --no-progress -y
            $ok = [bool](Get-Command ffmpeg -ErrorAction SilentlyContinue)
            if (-not $ok) { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) {
            Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
            Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
            $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            Add-Content $env:GITHUB_PATH $bin
          }
          $global:LASTEXITCODE = 0          # (a failed choco attempt must not fail the step; the next step checks ffmpeg)
      - name: Check ffmpeg has libx265
        shell: bash
        run: ffmpeg -hide_banner -encoders | grep -q libx265
      - run: pip install -r requirements-test.txt
      - name: Integration tests (synthetic clip built with ffmpeg; no footage or models needed)
        run: pytest tests/integration -n auto --durations=10

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:integration
