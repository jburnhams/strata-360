name: Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    env:
      STRATA_NO_RESOURCE_LIMITS: '1'          # the machine guards are for local machines; a CI runner is a VM of its own
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - uses: ./.github/actions/torch-cpu
      - name: Lockfile, lint, format and types (once, on the newest Python)
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run --no-sync strata-check --fast
      - name: Unit tests with coverage (unit suite only)
        run: uv run --no-sync pytest tests/unit --cov --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests with coverage (unit project only)
        run: npm run test:coverage
      - name: Coverage gate (unit + jsdom component tests together, floors in web/coverage-floor.json)
        run: npm run test:coverage:gate -- --coverage.reporter=text --coverage.reporter=json-summary
      - name: Build
        run: npm run build
