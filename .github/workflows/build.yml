name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libimage-exiftool-perl

    - name: Run setup script (Python & Web Build)
      run: |
        VENV=".venv" ./scripts/setup_env.sh --no-dfn

    - name: Install pytest
      run: |
        .venv/bin/pip install pytest

    - name: Run Python tests
      run: |
        mkdir -p videos
        touch videos/CAM_20260221120007_0019_D.OSV
        .venv/bin/pytest tests/

    - name: Typecheck Frontend
      run: |
        cd web && npm run typecheck
