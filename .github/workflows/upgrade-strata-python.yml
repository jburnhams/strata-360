name: Upgrade strata-python

# strata-python is a git dependency that tracks its main branch; uv.lock pins the commit. This moves the pin weekly (and on demand): it runs the
# whole gate and the integration tests on the new commit, and only if they pass opens a PR with the lockfile change. The gate runs here because a PR
# opened with the default token does not start the other workflows. Needs Settings > Actions > "Allow GitHub Actions to create pull requests".

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --upgrade-package strata-python
      - id: changed
        run: git diff --quiet uv.lock && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.changed == 'true'
        run: |
          uv sync --locked
      - if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/torch-cpu
      - if: steps.changed.outputs.changed == 'true'
        run: |
          uv run --no-sync strata-check
          uv run --no-sync pytest tests/integration -n auto
      - if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upgrade-strata-python
          title: Upgrade strata-python
          commit-message: Upgrade strata-python (uv lock --upgrade-package strata-python)
          body: |
            Moves the strata-python pin in `uv.lock` to its latest `main`. The gate (`strata-check`) and the integration tests passed on the new commit in the workflow run that opened this PR.
